{% extends 'base.html' %}
{% block content %}

    <p><a href="/articles">Retour au catalogue</a></p>

    <h1>Modifier un article ou une prestation</h1>

    {% if erreur %}
    <p role="alert">{{ erreur }}</p>
    {% endif %}

<form method="post" action="/articles/{{ article_id }}/modifier">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <p>
        <label for="reference">Référence</label><br>
        <input
            id="reference"
            name="reference"
            value="{{ saisie.get('reference', '') }}"
            required
        >
    </p>

    <p>
        <label for="designation">Désignation</label><br>
        <input
            id="designation"
            name="designation"
            value="{{ saisie.get('designation', '') }}"
            required
        >
    </p>

    <p>
        <label for="type_article">Type</label><br>
        <select id="type_article" name="type_article">
            <option
                value="produit"
                {% if saisie.get('type_article', 'produit') == 'produit' %}
                selected
                {% endif %}
            >Produit</option>

            <option
                value="service"
                {% if saisie.get('type_article') == 'service' %}
                selected
                {% endif %}
            >Prestation</option>
        </select>
    </p>

    <p>
        <label for="unite">Unité : pièce, heure, m²…</label><br>
        <input
            id="unite"
            name="unite"
            value="{{ saisie.get('unite', 'pièce') }}"
            required
        >
    </p>

    <p>
        <label for="prix_achat">Prix d’achat HT en F CFP</label><br>
        <input
            id="prix_achat"
            name="prix_achat"
            type="text"
            inputmode="decimal"
            value="{{ saisie.get('prix_achat', '0') }}"
            required
        >
    </p>

    <p>
        <label for="prix_vente">Prix de vente HT en F CFP</label><br>
        <input
            id="prix_vente"
            name="prix_vente"
            type="text"
            inputmode="decimal"
            value="{{ saisie.get('prix_vente', '0') }}"
            required
        >
    </p>

    <p>
        <label for="taxe">Taux de TVA à la vente en %</label><br>
        <input
            id="taxe"
            name="taxe"
            type="text"
            inputmode="decimal"
            value="{{ saisie.get('taxe', '0') }}"
            required
        >
    </p>

    <button type="submit">Enregistrer les modifications</button>
</form>
<p><a href="/articles">Annuler</a></p>

{% endblock %}
