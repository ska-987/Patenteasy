{% extends 'base.html' %}
{% block content %}

    <h1>Modifier une opération</h1>

    {% if erreur %}
    <p role="alert">{{ erreur }}</p>
    {% endif %}

    <form
        method="post"
        action="/journal/{{ operation_id }}/modifier"
    >
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <p>
            <label for="date_operation">Date</label><br>
            <input
                id="date_operation"
                name="date_operation"
                type="date"
                value="{{ saisie.get('date_operation', '') }}"
                required
            >
        </p>

        <p>
            <label for="libelle">Libellé</label><br>
            <input
                id="libelle"
                name="libelle"
                value="{{ saisie.get('libelle', '') }}"
                required
            >
        </p>

        <p>
            <label for="type_operation">Type</label><br>
            <select id="type_operation" name="type_operation">
                <option
                    value="recette"
                    {% if saisie.get('type_operation') == 'recette' %}
                    selected
                    {% endif %}
                >Recette encaissée</option>

                <option
                    value="depense"
                    {% if saisie.get('type_operation') == 'depense' %}
                    selected
                    {% endif %}
                >Dépense payée</option>
            </select>
        </p>

        <p>
            <label for="montant">Montant en F CFP</label><br>
            <input
                id="montant"
                name="montant"
                type="text"
                inputmode="decimal"
                value="{{ saisie.get('montant', '') }}"
                required
            >
        </p>

        <button type="submit">Enregistrer les modifications</button>
    </form>

    <p>
        <a href="/journal?annee={{ annee_retour }}">Annuler</a>
    </p>

{% endblock %}
