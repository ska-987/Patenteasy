{% extends 'base.html' %}
{% block content %}

    <p><a href="/">Retour à l’accueil</a></p>

    <h1>Mon entreprise</h1>

    {% if erreur %}
    <p role="alert">{{ erreur }}</p>
    {% endif %}

    <form method="post" action="/entreprise">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <p>
            <label for="nom">Nom de l’entreprise</label><br>
            <input
                id="nom"
                name="nom"
                value="{{ saisie.get('nom', '') }}"
                required
            >
        </p>

        <p>
            <label for="responsable">Responsable</label><br>
            <input
                id="responsable"
                name="responsable"
                value="{{ saisie.get('responsable', '') }}"
            >
        </p>

        <p>
            <label for="telephone">Téléphone</label><br>
            <input
                id="telephone"
                name="telephone"
                type="tel"
                value="{{ saisie.get('telephone', '') }}"
            >
        </p>

        <p>
            <label for="email">Adresse e-mail</label><br>
            <input
                id="email"
                name="email"
                type="email"
                value="{{ saisie.get('email', '') }}"
            >
        </p>

        <p>
            <label for="adresse">Adresse</label><br>
            <textarea
                id="adresse"
                name="adresse"
                rows="3"
            >{{ saisie.get('adresse', '') }}</textarea>
        </p>

        <p>
            <label for="numero_tahiti">Numéro TAHITI</label><br>
            <input
                id="numero_tahiti"
                name="numero_tahiti"
                value="{{ saisie.get('numero_tahiti', '') }}"
            >
        </p>

                <p>
            <label for="numero_rcs">Numéro RCS</label><br>
            <input
                id="numero_rcs"
                name="numero_rcs"
                value="{{ saisie.get('numero_rcs', '') }}"
            >
        </p>

        <p>Monnaie : F CFP (XPF)</p>

        <button type="submit">Enregistrer les coordonnées</button>
    </form>

    <h2>Début d’activité</h2>

    <form method="post" action="/entreprise/debut-activite">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <p>
            <label for="date_debut_activite">
                Date de début d’activité
            </label><br>

            <input
                id="date_debut_activite"
                name="date_debut_activite"
                type="date"
                value="{{ saisie.get('date_debut_activite', '') }}"
                required
            >
        </p>

        <button type="submit">Enregistrer la date de début</button>
    </form>

    <hr>

    <p>
        Étape suivante :
        <a href="/reprise">Reprendre mes recettes et dépenses</a>
    </p>

{% endblock %}
